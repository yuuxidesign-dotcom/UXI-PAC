<!-- ══════════════════════════════
     MODALS
══════════════════════════════ -->

<!-- 上游聯繫紀錄：新增 -->
<div id="modal-upstream-contact" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">🏥 新增上游聯繫紀錄</div>
      <button class="modal-close" onclick="closeModal('modal-upstream-contact')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:12px">
        <label>聯繫日期與時間</label>
        <input class="form-control" type="datetime-local" id="uc-datetime" value="2026-07-09T09:30">
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <label>聯繫方式</label>
        <div style="display:flex;gap:16px;margin-top:6px">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="uc-method" value="電話" checked style="accent-color:var(--blue)"> 電話</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="uc-method" value="Line" style="accent-color:var(--blue)"> Line</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="uc-method" value="當面" style="accent-color:var(--blue)"> 當面</label>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <label>回報狀態（可複選）</label>
        <div class="checklist" style="margin-top:6px">
          <div class="check-item"><input type="checkbox" id="uc-status-hosp" value="已回報收治・住院" onchange="toggleUpstreamOpenDate()"><span>已回報收治・住院</span></div>
          <div class="check-item"><input type="checkbox" id="uc-status-day" value="已回報收治・日照" onchange="toggleUpstreamOpenDate()"><span>已回報收治・日照</span></div>
          <div class="check-item"><input type="checkbox" id="uc-status-home" value="已回報收治・居家" onchange="toggleUpstreamOpenDate()"><span>已回報收治・居家</span></div>
          <div class="check-item"><input type="checkbox" id="uc-status-decline" value="已回報退案" onchange="toggleUpstreamOpenDate()"><span>已回報退案</span></div>
        </div>
      </div>
      <div class="form-group hidden" id="uc-opendate-wrap" style="margin-bottom:12px">
        <label>預計開案日</label>
        <input class="form-control" type="date" id="uc-opendate" value="2026-07-09">
      </div>
      <div class="form-group">
        <label>備註</label>
        <textarea class="form-control" rows="2" id="uc-note" placeholder="例如：已回報上游收治住院，預計7/15開案"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-upstream-contact')">取消</button>
      <button class="btn btn-primary" onclick="submitUpstreamContact()">儲存紀錄</button>
    </div>
  </div>
</div>

<!-- 家屬聯繫紀錄：新增 -->
<div id="modal-add-contact" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">📞 新增聯繫紀錄</div>
      <button class="modal-close" onclick="closeModal('modal-add-contact')">✕</button>
    </div>
    <div class="modal-body" id="add-contact-body">
      <!-- 由 JS 動態渲染（見 openAddContactModal，依既有聯繫紀錄筆數決定「本次聯繫結果」可選項）-->
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-add-contact')">取消</button>
      <button class="btn btn-primary" onclick="confirmAddContact()">儲存紀錄</button>
    </div>
  </div>
</div>

<!-- 轉換照護模式：依目標模式分為轉住院／轉居家（兩步驟或三步驟，見 個案管理4.js 轉換照護模式區塊）與轉日照（單步驟）-->
<div id="modal-convert-mode" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" id="convert-mode-title">轉換照護模式</div>
      <button class="modal-close" onclick="closeModal('modal-convert-mode')">✕</button>
    </div>
    <div class="modal-body" id="convert-mode-body">
      <!-- 由 JS 動態渲染（見 openConvertModeModal / renderConvertModeModal）-->
    </div>
    <div class="modal-footer" id="convert-mode-footer">
      <!-- 由 JS 動態渲染 -->
    </div>
  </div>
</div>

<!-- 展延成功：更新預計結案日期 -->
<div id="modal-extension-success" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">展延成功・更新預計結案日期</div>
      <button class="modal-close" onclick="closeModal('modal-extension-success')">✕</button>
    </div>
    <div class="modal-body">
      <div class="info-note blue">請確認新的預計結案日期，系統已依疾病別法規規定自動帶入，可手動修正。</div>
      <div class="form-group" style="margin-top:12px;margin-bottom:12px">
        <label>核定展延週數</label>
        <select class="form-control" id="ext-success-weeks">
          <option value="0">0 週</option>
          <option value="1">1 週</option>
          <option value="2">2 週</option>
          <option value="3">3 週</option>
          <option value="4">4 週</option>
          <option value="5">5 週</option>
          <option value="6">6 週</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <label>新的預計結案日期</label>
        <input class="form-control" type="date" id="ext-success-closedate">
      </div>
      <div class="form-group">
        <label>備註（選填）</label>
        <textarea class="form-control" rows="2" id="ext-success-note" placeholder="補充說明..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-extension-success')">取消</button>
      <button class="btn btn-primary" onclick="confirmExtensionSuccess()">確認並通知復健師</button>
    </div>
  </div>
</div>

<!-- 評估量表 Tab「送出提醒」：勾選提醒對象（復健主管＋該筆紀錄治療師）後送出 -->
<div id="modal-assessment-reminder" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">送出填寫提醒</div>
      <button class="modal-close" onclick="closeModal('modal-assessment-reminder')">✕</button>
    </div>
    <div class="modal-body">
      <div class="info-note blue">請勾選要提醒的對象</div>
      <div id="assessment-reminder-targets" style="margin-top:10px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-assessment-reminder')">取消</button>
      <button class="btn btn-primary" onclick="confirmSendAssessmentReminder()">送出提醒</button>
    </div>
  </div>
</div>

<!-- 匯出展延資料 -->
<div id="modal-export-extend" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📤 匯出展延資料</div>
      <button class="modal-close" onclick="closeModal('modal-export-extend')">✕</button>
    </div>
    <div class="modal-body" id="export-extend-body">
      <!-- 由 JS 動態渲染（見 openExportExtendModal，依個案照護模式決定項目）-->
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-export-extend')">取消</button>
      <button class="btn btn-primary" onclick="closeModal('modal-export-extend');alert('展延資料已匯出（PDF）')">匯出 PDF</button>
    </div>
  </div>
</div>

<!-- 匯出結案資料 -->
<div id="modal-export-close" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📤 匯出結案資料</div>
      <button class="modal-close" onclick="closeModal('modal-export-close')">✕</button>
    </div>
    <div class="modal-body" id="export-close-body">
      <!-- 由 JS 動態渲染（見 openExportCloseModal，依個案照護模式決定項目）-->
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-export-close')">取消</button>
      <button class="btn btn-primary" onclick="closeModal('modal-export-close');alert('結案資料已匯出（PDF）')">匯出 PDF</button>
    </div>
  </div>
</div>

<!-- 結案管理（依呼叫端鎖定單一類型，或提供正式病歷類型清單供選擇） -->
<div id="modal-archive" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" id="archive-modal-title">結案管理</div>
      <button class="modal-close" onclick="closeModal('modal-archive')">✕</button>
    </div>
    <div class="modal-body" id="archive-modal-body">
      <!-- 由 JS 動態渲染（見 openArchiveModal / renderArchiveModalBody） -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-archive')">取消</button>
      <button class="btn btn-danger" onclick="confirmArchive()">確認</button>
    </div>
  </div>
</div>

<!-- 新增患者：僅限一般個案（PAC/復健病房不開放從此處直接新增，需走收案管理正式流程） -->
<div id="modal-new-patient" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">📥 從杏翔匯入患者</div>
      <button class="modal-close" onclick="closeModal('modal-new-patient')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:12px">
        <label>病歷號 <span class="required">*</span></label>
        <div style="display:flex;gap:8px">
          <input class="form-control" id="np-mrn-search" placeholder="e.g. 123456" style="flex:1">
          <button class="btn btn-secondary" onclick="searchNewPatientMrn()">查詢杏翔</button>
        </div>
        <div id="np-mrn-search-hint" style="margin-top:8px"></div>
      </div>
      <div id="np-import-fields" class="hidden">
        <div class="info-note green" style="margin-bottom:12px" id="np-import-summary"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group"><label>類型 <span class="required">*</span></label>
            <select class="form-control" id="np-casetype" onchange="onNewPatientTypeOrModeChange()">
              <option value="">請選擇</option>
              <option value="復健病房">復健病房</option>
              <option value="一般">一般</option>
            </select>
          </div>
          <div class="form-group"><label>疾病別</label><input class="form-control" id="np-disease" placeholder="可直接輸入"></div>
          <div class="form-group"><label>照護模式 <span class="required">*</span></label>
            <select class="form-control" id="np-mode" onchange="onNewPatientTypeOrModeChange()">
              <option value="">請選擇</option>
              <option value="住院">住院</option>
              <option value="日照">日照</option>
              <option value="居家">居家</option>
            </select>
          </div>
          <div class="form-group"><label>是否需復健 <span class="required">*</span></label>
            <select class="form-control" id="np-needsrehab">
              <option value="">請選擇</option>
              <option value="true">需復健</option>
              <option value="false">不需復健</option>
            </select>
          </div>
          <div class="form-group hidden" id="np-admissiontype-wrap"><label>住院類型 <span class="required">*</span></label>
            <select class="form-control" id="np-admissiontype">
              <option value="">請選擇</option>
              <option value="一般住院">一般住院</option>
              <option value="安寧">安寧</option>
            </select>
          </div>
          <div class="form-group"><label>開案日</label><input class="form-control" type="date" id="np-opendate"></div>
          <div class="form-group"><label>預計結案日</label><input class="form-control" type="date" id="np-closedate"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-new-patient')">取消</button>
      <button class="btn btn-primary" id="np-save-btn" disabled onclick="saveNewPatient()">儲存患者</button>
    </div>
  </div>
</div>

<!-- 轉換類型：一般／復健病房／PAC 三種類型互轉，只能轉成非目前類型的其他類型 -->
<div id="modal-convert-pac" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" id="modal-convert-pac-title">🔀 轉換類型</div>
      <button class="modal-close" onclick="closeModal('modal-convert-pac')">✕</button>
    </div>
    <div class="modal-body" id="convert-pac-body">
      <!-- 由 JS 動態渲染（見 openConvertPatientTypeModal）-->
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-convert-pac')">取消</button>
      <button class="btn btn-primary" onclick="submitConvertPatientType()">確認轉換</button>
    </div>
  </div>
</div>

<!-- 結案管理（所有患者展開列快速入口）：依類型顯示可選項，點擊直接送出 -->
<div id="modal-quick-archive" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">📁 結案管理</div>
      <button class="modal-close" onclick="closeModal('modal-quick-archive')">✕</button>
    </div>
    <div class="modal-body" id="quick-archive-body">
      <!-- 由 JS 動態渲染（見 openQuickArchiveModal）-->
    </div>
  </div>
</div>

<script src="個案管理4.js"></script>
</body>
</html>
